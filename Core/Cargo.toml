[package]
name = "everything-core"
version = "0.4.9"
edition = "2024"
rust-version = "1.93"
license-file = "../LICENSE"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "everything-index"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "=0.1.25"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
